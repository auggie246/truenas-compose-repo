# LiteLLM Proxy stack — pinned to a specific stable version.
# Bump the litellm image tag below to upgrade; never use a floating tag.
services:
  litellm:
    # Requirement 1: pinned to a specific version (NOT main-stable / main-latest).
    # The *-database image ships with Prisma pre-generated, needed for virtual keys.
    image: ghcr.io/berriai/litellm-database:v1.86.2
    container_name: litellm
    hostname: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      proxy:
      litellm:
      lan:
        ipv4_address: 192.168.1.132
    # Requirement 3: secrets are loaded from .env (master key, salt key, tokens, DB creds).
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      STORE_MODEL_IN_DB: "True"
    volumes:
      # Requirement 2: config is mounted into the container.
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
    
      # --- shared HTTP -> HTTPS redirect ---
      - traefik.http.middlewares.litellm-https-redirect.redirectscheme.scheme=https
    
      # --- Internal: full access (all paths incl. /ui) ---
      - traefik.http.routers.litellm.entrypoints=http
      - traefik.http.routers.litellm.rule=Host(`litellm.YOUR_DOMAIN.co.uk`)
      - traefik.http.routers.litellm.middlewares=litellm-https-redirect
    
      - traefik.http.routers.litellm-secure.entrypoints=https
      - traefik.http.routers.litellm-secure.rule=Host(`litellm.YOUR_DOMAIN.co.uk`)
      - traefik.http.routers.litellm-secure.tls=true
      - traefik.http.routers.litellm-secure.tls.certresolver=cloudflare
      - traefik.http.routers.litellm-secure.tls.domains[0].main=YOUR_DOMAIN.co.uk
      - traefik.http.routers.litellm-secure.tls.domains[0].sans=*.YOUR_DOMAIN.co.uk
    
      # --- External: everything EXCEPT /ui ---
      - traefik.http.routers.litellm-ext.entrypoints=http-external
      - traefik.http.routers.litellm-ext.rule=Host(`litellm.YOUR_DOMAIN.co.uk`) && !PathPrefix(`/ui`)
      - traefik.http.routers.litellm-ext.middlewares=litellm-https-redirect
    
      - traefik.http.routers.litellm-ext-secure.entrypoints=https-external
      - traefik.http.routers.litellm-ext-secure.rule=Host(`litellm.YOUR_DOMAIN.co.uk`) && !PathPrefix(`/ui`)
      - traefik.http.routers.litellm-ext-secure.tls=true
      - traefik.http.routers.litellm-ext-secure.tls.certresolver=cloudflare
    
      # --- service (single service auto-binds to all routers) ---
      - traefik.http.services.litellm.loadbalancer.server.port=4000

  db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    networks:
    - litellm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  litellm_pgdata:

networks:
  proxy:
    external: true
  litellm:
    external: true
  lan:
    external: true